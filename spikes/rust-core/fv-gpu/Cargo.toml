[package]
name = "fv-gpu"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Spike: fv-core's hot phases as integer compute shaders (wgpu / WebGPU), bit-identical to the CPU"

[dependencies]
fv-core = { path = "../fv-core", default-features = false }
wgpu = { version = "30", default-features = false, features = ["wgsl", "vulkan", "metal", "dx12", "webgpu", "std"] }
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

[dev-dependencies]
fv-core = { path = "../fv-core" }
