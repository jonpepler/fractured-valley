[package]
name = "fv-core"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Spike: the Fractured Valley simulation core, energy-first"

[dependencies]
libm = "0.2"
rapier3d = { version = "0.36", features = ["enhanced-determinism"] }
rayon = { version = "1.10", optional = true }

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
# Make the radiation field the default way light travels (instead of packets).
field-light = []
