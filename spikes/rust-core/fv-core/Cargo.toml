[package]
name = "fv-core"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Spike: the Fractured Valley simulation core, energy-first"

[dependencies]
libm = "0.2"
rapier3d = { version = "0.36", features = ["enhanced-determinism"] }
rayon = { version = "1.10", optional = true }

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
# Make the radiation field the default way light travels (instead of packets).
field-light = []
# Cells 5 cm on a side instead of 10 cm (every per-cell quantity is derived
# from `substance::CELL_MM`). Structure, falling bodies and rendering still
# assume 10 cm.
cell-5cm = []
